# Regole nginx per RunCloud — Web App "mdg" (stack: Native NGINX + Custom config).
# Incollate in: Web Application > NGINX Config > Create Standalone Config
#   Type        = location.main-before   (incluso a LIVELLO SERVER, prima del "location /" di default)
#   Config Name = qualsiasi (es. cleanurl-redirects)
# Poi "Run and Debug" (nginx -t) e "Update config" (ricarica nginx).
#
# Fanno due cose:
#   1) URL puliti (build.format:'file'):  /contatti  ->  contatti.html   (niente .html, niente slash)
#   2) i 301 legacy che su Cloudflare stavano in _redirects.
#
# NB: NON usare "location / { ... }" qui: su questo stack esiste già un "location /" di
# default e nginx darebbe "duplicate location". Si usa invece una location REGEX per i path
# senza estensione, che ha priorità sul prefix "location /" di default. I file con estensione
# (.css .js .png .woff2 .php ...) contengono un punto, non matchano la regex e proseguono verso
# gli handler statici/PHP di default.

index index.html;

# --- Redirect 301 legacy (URL indicizzati da Google che non esistono più) ---
location = /about        { return 301 /; }
location = /agriturismo  { return 301 /wine-resort; }
location = /diary        { return 301 /; }
location ^~ /news/       { return 301 /; }

# --- URL puliti: qualsiasi path SENZA estensione -> prova $uri, poi $uri.html, poi la dir ---
# /contatti -> /contatti.html ; /en -> /en.html ; /en/contatti -> /en/contatti.html ;
# /vini/<slug> -> /vini/<slug>.html ; / -> index.html (via $uri/ + index).
location ~ ^/[^.]*$ {
    try_files $uri $uri.html $uri/ =404;
}

# --- Modulo contatti (PHP) — DA CABLARE AL GO-LIVE ---
# ATTENZIONE: lo stack "Native NGINX + Custom config" NON instrada da solo i .php al PHP-FPM.
# Verificato: GET /contact.php restituisce il SORGENTE (Content-Type octet-stream), il PHP non
# viene eseguito. Prima di attivare l'invio SendGrid serve un handler FastCGI, es.:
#
#   location ~ \.php$ {
#       try_files $uri =404;
#       fastcgi_pass unix:/var/run/php-fpmXX-<webapp>.sock;   # socket reale del pool RunCloud
#       fastcgi_index index.php;
#       fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
#       include /etc/nginx-rc/conf.d/<...>/fastcgi_params;    # oppure lo snippet RunCloud
#   }
#
# In alternativa (più semplice) ricreare il web app con stack "Native NGINX" gestito (non custom),
# che genera l'handler PHP automaticamente. Poi impostare la env SENDGRID_API_KEY e in
# content/contatti.md + content/en/contatti.md l'endpoint "/contact.php". Vedi docs/DEPLOY-RUNCLOUD.md.
# Finché l'endpoint del form resta "" il modulo non chiama contact.php: nessun invio accidentale.
