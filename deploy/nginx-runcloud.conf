# Regole nginx per RunCloud — da incollare nella "NGINX Config" del web app.
# Equivalgono a: URL puliti (build.format:'file') + i 301 legacy che su Cloudflare erano in _redirects.

# --- URL puliti: /contatti serve contatti.html (niente .html, niente slash finale) ---
location / {
    try_files $uri $uri.html $uri/ =404;
}

# (facoltativo) canonicalizza: /contatti.html -> /contatti
if ($request_uri ~ ^/(.*)\.html(\?|$)) {
    return 301 /$1;
}

# --- Redirect 301 legacy (URL indicizzati da Google che non esistono più) ---
location = /about        { return 301 /; }
location = /agriturismo  { return 301 /wine-resort; }
location = /diary        { return 301 /; }
location ^~ /news/       { return 301 /; }

# --- Modulo contatti: PHP-FPM esegue /contact.php (già incluso nella build in dist/) ---
# Su RunCloud il web app PHP instrada .php al FPM: nessuna regola extra necessaria.
# Assicurarsi solo che la env SENDGRID_API_KEY sia impostata (vedi docs/DEPLOY-RUNCLOUD.md).
